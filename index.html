<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Выпускной Эвелин МакФи</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #2d5a27; /* Трава */
            font-family: Arial, sans-serif;
            touch-action: none; /* Отключаем стандартные скроллы при свайпе на смартфоне */
        }
        
        .header {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 16px; opacity: 0.9; }

        #gameCanvas {
            display: block;
            background-image: linear-gradient(#8ecae6 0%, #219ebc 100%); /* Небо квиддича */
        }

        /* Плашка поздравления */
        #congratPopup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            color: #333;
            max-width: 90%;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        #congratPopup.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }
        #congratPopup p.message { 
            font-size: 18px; 
            margin-bottom: 15px; 
            line-height: 1.4;
        }
        #congratPopup p.author { 
            font-weight: bold; 
            color: #d35400; /* Оранжевый цвет для имени отправителя */
            font-style: italic; 
            font-size: 16px;
        }
        #nextBtn {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 16px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #nextBtn:hover { background-color: #2ecc71; }

        /* Добавил стиль для кнопки "Новая игра" */
        #restartBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 25px;
            font-size: 16px;
            background-color: #ff6b6b; /* Красный цвет */
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: none; /* Скрываем её изначально */
        }
        #restartBtn:hover { background-color: #f44336; }
    </style>
</head>
<body>
<div class="header">
    <h1>Выпускной Эвелин МакФи</h1>
    <p>Поймай все квоффлы!</p>
</div>
    
<!-- Добавлена кнопка для повторной игры -->
<button id="restartBtn">Новая игра</button>

<canvas id="gameCanvas"></canvas>

<div id="congratPopup">
    <p class="message">Здесь будет текст поздравления</p>
    <p class="author">— Грэйс</p>
    <button id="nextBtn">Дальше</button>
</div>

<script>
// ⚠️ ВАЖНО! Ссылки должны вести на raw.githubusercontent.com
const imgGirl = new Image(); // Персонаж ✅
imgGirl.src = 'https://raw.githubusercontent.com/GGreyland/for_evylin/main/character.png'; 

/* Исправленная ссылка! */
const imgBall = new Image(); // Мяч ✅
imgBall.src = 'https://raw.githubusercontent.com/GGreyland/for_evylin/main/ball.png';

const imgBg = new Image(); // Фон ✅
imgBg.src = 'https://raw.githubusercontent.com/GGreyland/for_evylin/main/field.png';

let resourcesLoaded = false; // Флаг готовности

// Ждём, пока загрузятся ВСЕ ресурсы
Promise.all([
    loadImage(imgGirl),
    loadImage(imgBall),
    loadImage(imgBg)
]).then(() => {
    console.log('Все ресурсы загружены!');
    resourcesLoaded = true;
    initGame();
});

function loadImage(image) {
    return new Promise((resolve, reject) => {
        image.onload = resolve;
        image.onerror = () => reject(new Error(`Не удалось загрузить ${image.src}`));
    });
}

// --- Данные ---
const congratulations = [
    {text: "Текст поздравления", author: "Грэйс"},
    {text: "Текст поздравления", author: "Энни"},
];

// --- Объекты игры ---
let girl = { x: 0, y: 0, size: 70 };
let balls = [];
let currentBallIndex = 0;
let isPausedForPopup = false;

// Управление
let keys = {};
let targetTouchX = null;
let targetTouchY = null;

// Настройки
const BALL_COUNT = 10;
const FIELD_PADDING = 50;

// Получение элементов ДО запуска игры
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const popup = document.getElementById('congratPopup');
const messageText = popup.querySelector('.message');
const authorText = popup.queryselector('.author'); // Исправлено queryselector
const nextBtn = document.getElementById('nextBtn');
const restartBtn = document.getElementById('restartBtn');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

class Ball {
    constructor(index) {
        this.index = index;
        this.reset();
    }

    reset() {
        const edges = ['top', 'right', 'bottom', 'left'];
        const edge = edges[Math.floor(Math.random() * edges.length)];

        switch(edge) {
            case 'top':
                this.x = Math.random() * (canvas.width - FIELD_PADDING * 2) + FIELD_PADDING;
                this.y = -30;
                break;
            case 'right':
                this.x = canvas.width + 30;
                this.y = Math.random() * (canvas.height - FIELD_PADDING * 2) + FIELD_PADDING;
                break;
            case 'bottom':
                this.x = Math.random() * (canvas.width - FIELD_PADDING * 2) + FIELD_PADDING;
                this.y = canvas.height + 30;
                break;
            case 'left':
                this.x = -30;
                this.y = Math.random() * (canvas.height - FIELD_PADDING * 2) + FIELD_PADDING;
                break;
        }

        this.size = 25;
        this.caught = false;

        // Летит по прямой с небольшим отклонением
        const angleToCenter = Math.atan2(canvas.height / 2 - this.y, canvas.width / 2 - this.x);
        const randomAngle = angleToCenter + (Math.random() - 0.5) * 0.3; // +/- ~17 градусов

        this.speed = 0.8 + Math.random() * 1; // Средняя скорость от 0.8 до 1.8 пикселя в кадр
        this.vx = Math.cos(randomAngle) * this.speed;
        this.vy = Math.sin(randomAngle) * this.speed;
    }

    update() {
        if (!resourcesLoaded || this.caught) return; // Не двигаем мяч, если ресурсы ещё грузятся

        this.x += this.vx;
        this.y += this.vy;

        // Отскок от стенок игрового поля
        if (this.x <= FIELD_PADDING || this.x >= canvas.width - FIELD_PADDING) {
            this.vx *= -1;
            this.x = Math.max(FIELD_PADDING, Math.min(this.x, canvas.width - FIELD_PADDING));
        }
        if (this.y <= FIELD_PADDING || this.y >= canvas.height - FIELD_PADDING) {
            this.vy *= -1;
            this.y = Math.max(FIELD_PADDING, Math.min(this.y, canvas.height - FIELD_PADDING));
        }

        // Проверяем только тот мяч, который сейчас летит
        if (currentBallIndex !== this.index) return;

        const dx = girl.x - this.x;
        const dy = girl.y - this.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        // Увеличенная зона ловли (персонаж стал больше)
        if (distance < girl.size / 2 + this.size / 2) {
            this.caught = true;
            showCongratulations(this.index);
        }
    }

    draw() {
        if (this.caught && !isPausedForPopup) return; // Не рисуем пойманные мячи во время игры
        if (!this.caught && isPausedForPopup) return; // Не рисуем активные мячи во время паузы

        // Подсветка золотым контуром остается поверх картинки
        if (this.caught) {
            ctx.beginPath();
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'gold';
            ctx.ellipse(this.x, this.y, this.size + 6, this.size + 6, 0, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Рисуем картинку мяча
        if (imgBall.complete) {
            ctx.drawImage(
                imgBall,
                this.x - this.size / 2, // Левая верхняя точка
                this.y - this.size / 2,
                this.size,              // Ширина
                this.size               // Высота
            );
        } else {
            ctx.fillStyle = '#8b4513';
            ctx.ellipse(this.x, this.y, this.size, this.size, 0, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

function initGame() {
    resizeCanvas();
    balls = [];
    for(let i = 0; i < BALL_COUNT; i++) {
        balls.push(new Ball(i));
    }
    currentBallIndex = 0;
    isPausedForPopup = false;
    restartBtn.style.display = 'none'; // Прячем кнопку после старта
}

function gameLoop() {
    if (!resourcesLoaded) return; // Если ресурсы не загрузились, цикл рендеринга пропускает ход
    if (isPausedForPopup) {
        requestAnimationFrame(gameLoop);
        return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Фон
    if (imgBg.complete) {
        ctx.drawImage(imgBg, 0, 0, canvas.width, canvas.height);
    } else {
        ctx.fillStyle = '#2d5a27'; /* Трава */
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Разметка полей для квиддича (ворота)
    ctx.strokeStyle = '#ffffff40';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.rect(FIELD_PADDING, FIELD_PADDING, canvas.width - FIELD_PADDING * 2, canvas.height - FIELD_PADDING * 2);
    ctx.moveTo(canvas.width / 2, FIELD_PADDING);
    ctx.lineTo(canvas.width / 2, canvas.height - FIELD_PADDING); // ИСПРАВЛЕНО!
    ctx.stroke();

    ctx.fillStyle = '#f1c40f';
    ctx.beginPath();
    ctx.ellipse(canvas.width / 2, FIELD_PADDING + 50, 40, 15, 0, 0, Math.PI * 2);
    ctx.fill();
    [canvas.height / 3, canvas.height / 3 * 2].forEach(yPos => {
        ctx.beginPath();
        ctx.ellipse(FIELD_PADDING + 50, yPos, 15, 40, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(canvas.width - FIELD_PADDING - 50, yPos, 15, 40, 0, 0, Math.PI * 2);
        ctx.fill();
    });

    handleInput();

    // Девочка 👧
    if (imgGirl.complete) {
        ctx.drawImage(
            imgGirl,
            girl.x - girl.size / 2, // Левая верхняя точка персонажа
            girl.y - girl.size / 2,
            girl.size,
            girl.size
        );
    } else {
        ctx.fillStyle = '#ff6600';
        ctx.beginPath();
        ctx.arc(girl.x, girl.y, girl.size / 2, 0, Math.PI * 2);
        ctx.fill();
    }

    // Мячи ⚽
    balls.forEach(ball => {
        ball.update();
        ball.draw();
    });

    requestAnimationFrame(gameLoop);
}

// Обработка ввода
function handleInput() {
    let moveSpeed = 5;
    
    // Смартфон: тянем пальцем
    if (targetTouchX !== null && targetTouchY !== null) {
        const angle = Math.atan2(targetTouchY - girl.y, targetTouchX - girl.x);
        girl.x += Math.cos(angle) * moveSpeed;
        girl.y += Math.sin(angle) * moveSpeed;
    } 
    // ПК: стрелки
    else {
        if (keys['ArrowUp']) girl.y -= moveSpeed;
        if (keys['ArrowDown']) girl.y += moveSpeed;
        if (keys['ArrowLeft']) girl.x -= moveSpeed;
        if (keys['ArrowRight']) girl.x += moveSpeed;
    }

    // Ограничиваем передвижение рамками поля
    girl.x = Math.max(girl.size / 2 + FIELD_PADDING, Math.min(girl.x, canvas.width - girl.size / 2 - FIELD_PADDING));
    girl.y = Math.max(girl.size / 2 + FIELD_PADDING, Math.min(girl.y, canvas.height - girl.size / 2 - FIELD_PADDING));
}

window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// Тач-управление
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    targetTouchX = touch.clientX - rect.left;
    targetTouchY = touch.clientY - rect.top;
});
canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    targetTouchX = touch.clientX - rect.left;
    targetTouchY = touch.clientY - rect.top;
});
canvas.addEventListener('touchend', () => {
    targetTouchX = null;
    targetTouchY = null;
});

// Клик мышью тоже работает как точка назначения
canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    targetTouchX = e.clientX - rect.left;
    targetTouchY = e.clientY - rect.top;
});
canvas.addEventListener('mousemove', (e) => {
    if (targetTouchX !== null) {
        const rect = canvas.getBoundingClientRect();
        targetTouchX = e.clientX - rect.left;
        targetTouchY = e.clientY - rect.top;
    }
});
canvas.addEventListener('mouseup', () => {
    targetTouchX = null;
    targetTouchY = null;
});

// Закрытие поздравительной плашки
nextBtn.addEventListener('click', hideCongratulations);
popup.addEventListener('click', (e) => {
    // Если кликнули мимо кнопки — закрываем тоже
    if (e.target === popup) hideCongratulations();
});

// Функция показа попапа
function showCongratulations(index) {
    isPausedForPopup = true;
    
    const data = congratulations[index];
    messageText.textContent = data.text;
    authorText.textContent = `— ${data.author}`;
    
    // Имя автора может быть длинным, корректируем ширину попапа
    const estimatedWidth = Math.min(400, Math.max(250, data.author.length * 10));
    popup.style.maxWidth = `${estimatedWidth}px`;
    
    popup.classList.add('active');
}

// Функция закрытия попапа
function hideCongratulations() {
    popup.classList.remove('active');
    setTimeout(() => {
        isPausedForPopup = false;
        currentBallIndex++;
        if (currentBallIndex < BALL_COUNT) {
             // Сбрасываем управление, чтобы игрок не улетел далеко во время паузы
            keys = {};
            targetTouchX = null;
            targetTouchY = null;
        } else {
            finishGame();
        }
    }, 400); // Ждем завершения анимации CSS
}

// Завершение игры
function finishGame() {
    // alert("Ты собрала все поздравления!");
    restartBtn.style.display = ''; // Показываем кнопку новой игры
}

// ⚡️ Новый обработчик для кнопки "Новая игра"
restartBtn.addEventListener('click', () => {
    initGame();
});

window.addEventListener('resize', resizeCanvas);

initGame(); // Эта функция теперь вызывается асинхронно, см. выше
</script>

</body>
</html>
