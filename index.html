<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Выпускной Эвелин МакФи</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #2d5a27; /* Трава */
            font-family: Arial, sans-serif;
            touch-action: none; /* Отключаем стандартные скроллы при свайпе на смартфоне */
        }
        
        .header {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 16px; opacity: 0.9; }

        #gameCanvas {
            display: block;
            background-image: linear-gradient(#8ecae6 0%, #219ebc 100%); /* Небо квиддича */
        }

        /* Плашка поздравления */
        #congratPopup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            color: #333;
            max-width: 100%;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        #congratPopup.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }
        #congratPopup p.message { 
            font-size: 18px; 
            margin-bottom: 15px; 
            line-height: 1.4;
        }
        #congratPopup p.author { 
            font-weight: bold; 
            color: #d35400; /* Оранжевый цвет для имени отправителя */
            font-style: italic; 
            font-size: 16px;
        }
        #nextBtn {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 16px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #nextBtn:hover { background-color: #2ecc71; }
    </style>
</head>
<body>
<div class="header">
    <h1>Выпускной Эвелин МакФи</h1>
    <p>Поймай все квоффлы!!</p>
</div>
    
<canvas id="gameCanvas"></canvas>

<div id="congratPopup">
    <p class="message">Здесь будет текст поздравления</p>
    <p class="author">— Грэйс</p>
    <button id="nextBtn">Дальше</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const popup = document.getElementById('congratPopup');
const messageText = popup.querySelector('.message');
const authorText = popup.querySelector('.author');
const nextBtn = document.getElementById('nextBtn');

// --- Данные ---
// Сюда вставьте ваши настоящие тексты вместо "Текст поздравления"
const congratulations = [
    {text: "Поздравляю с выпуском! Рада видеть, как ты растешь в своем деле. Уверена, что у тебя всё получится, и ты станешь замечательным наставником для своих студентов.", author: "Женевьева Ханнэм"},
    {text: "Сегодня ты официально закрываешь одну из самых ярких глав своей жизни. Позади бессонные ночи, экзамены, переживания, победы и бесчисленные моменты, которые навсегда останутся частью твоей истории. Ты была замечательной старостой Пуффендуя, человеком, на которого всегда можно положиться. Ты проявила себя как талантливая спортсменка, справедливый судья по квиддичу, мудрый преподаватель Колдомедицины и просто невероятно добрый, искренний и светлый человек. Пусть любое заклинание удаётся с первого раза, мечты становятся реальностью, а счастье всегда находит дорогу к твоему дому. Никогда не теряй свою доброту, силу характера и ту искреннюю улыбку, которая делает мир вокруг чуточку теплее. С выпуском, Эвелин! Пусть магия этой истории никогда не заканчивается, а впереди тебя ждут только самые удивительные приключения.", author: "Лекси Брэнсон"},
    {text: "Дорогая, мисс McFie! Поздравляю тебя с получением диплома! Теперь ты взрослая и важная профессор) Я всегда буду помнить твою поддержку на своей первой игре. Пусть во взрослой жизни у тебя будут минуты, когда ты сможешь отбросить условности и побыть ребёнком, пошалить или сделать глупость! ", author: "Алессандра Куинн"},
    {text: "Дорогая Эвелин! Поздравляю тебя с получением диплома и завершением школы. Ты красотка, умница и спортсменка, а теперь еще и профессор! И всех твоих талантов одной мне не перечислить (как хорошо, что я тут не одна!) Твои фантазия, умение размышлять, придумывать невероятные вещи вызывают у меня только восхищение. Всегда очень радовалась, когда совы приносили мне твои работы по зельеварению, ведь они просто великолепны. Они для меня как кусочек вишневого пирога в холодный ненастный вечер — вкусно, интересно и хочется еще(и не толстеешь!) Желаю тебе счастья, радости от того, что делаешь, и успехов в работе профессором Колдомедицины. Пусть твои ученики радуют тебя своими работами, а жизнь всегда будет наполнена волшебством и вдохновением!", author: "Блейк"},
    {text: "Привет, Эвелин! Мне не удалось с тобой взаимодействовать, потому что я только распределился, но уверен — ты крутая! Выпуститься из Хогвартса - это много усилий и ты успешно с этим справилась. Поздравляю тебя и желаю так же успешно справляться с любым новым начинанием!", author: "Майлс Альварес"},
    {text: "Эви! Когда-то именно твоя пушистая коса привела меня к мысли о Пуффе. Ты держала баланс и создавала тепло на факультете долго и уверенно. Теперь, во взрослой жизни, желаю, что бы к тебе стократ вернулось то, что ты дарила с такой самоотдачей и очарованием!", author: "Marin Seafour"},
    {text: "В прекрасный день взросления, когда по лестнице жизни мы поднимаемся чуть выше, желаю, чтобы все начинания были успешными. Чтобы какая бы преграда не явилась на пути,. хватило сил ее перешагнуть и идти дальше. Чтобы солнце светило даже в самую пасмурную погоду и радовало своим теплом!", author: "Сесилио Пирас"},
    {text: "Эви! Поздравляю с окончанием студенческого пути и началом взрослой жизни 🫶🏻💚 Пусть она будет насыщенной, интересной и полной незабываемых моментов.", author: "Каталина Вульф"},
    {text: "Эвиии, поздравляю тебя с выпуском! Школа позади, а перед тобой — весь мир и тысячи новых возможностей. Желаю тебе смело идти к своим мечтам, верить в себя и кайфовать от каждого шага. Теперь ты профессор :) Пусть новая глава будет еще интереснее, ярче и круче. Лети к своим целям и никогда не сомневайся в себе! 🎉🚀", author: "Элейн Тодд"},
    {text: "Эвелин, поздравляю Вас с днём рождения! Прекрасный человек, преподаватель, староста, спортсменка — и просто Вау, что за девушка! Внимательная, добрая, волшебная! Можно сказать множество комплиментов, и все они точно будут описывать Вас. А Ваши лекции — просто искусство. Желаю приятных людей на пути, удивительной жизни и моря удовольствия от всего, что Вы делаете!", author: "Амилия Лиссаранд"},
    {text: "Поздравляю с переходом на новый этап жизни! Пусть школьные годы как можно дольше остаются в памяти и вызывают только теплые воспоминания. А взрослая жизнь пусть будет легкой, насыщенной, яркой и принесет много счастливых моментов!", author: "Ананель Коваль"},
    {text: "От всего сердца поздравляю тебя, Эвелин. Ты прошла очень важный этап жизни и стала взрослой. И запомни самое главное, если что-то пойдет не так, мы всегда будем рядом и поддержим в любой момент.", author: "Alejandro "},
    {text: "Эви, я помню, как ты появилась на факультете — тихая, незаметная. И как ты расцвела за семь семестров! Ты проявила себя невероятно трудолюбивой и талантливой волшебницей, верным другом, настоящей пуффендуйкой. Ты была славной старостой, какую только мог желать Пуффендуй: мудрой, справедливой, невероятно чуткой. Твои успехи в квиддиче поражают. С тобой невероятно легко и приятно играть в одной команде. А уж вратарь ты просто прирождённый. Желаю тебе увлекательного профессорского пути, неиссякаемого вдохновения для участия во всём, что тебе будет интересно.", author: "Алиса Индиго"},
    {text: "Поздравляю, Эви! 💛", author: "Сэм Кинз"},
    {text: "Всего самого наилучшего! Удачи в магической карьере) Ты большая молодец что дошла до конца^^", author: "Курои Тсуки"},
    {text: "Эвелин, поздравляю! Путь был насыщенным и ярким, но впереди - новый. Не сдавай позиции. Ты прекрасный человек. На лекциях я у тебя не бывал, но уверен, что школа выиграла эту жизнь, обретя тебя в качестве профессора. Удачи и трудовых подвигов!", author: "Уилл"},
    {text: "Мисс МакФи! Примите искренние поздравления с успешным окончанием обучения! Вы проявили большую целеустремлённость и трудолюбие — это по-настоящему ценные качества. Желаю уверенно двигаться вперёд, раскрывать свой потенциал и достигать самых смелых целей. Пусть знания, полученные за время учёбы, станут надёжной опорой в будущем. И увидимся у кофейника в преподавательской :)", author: "Adeline Delhi-Schafer"},
    {text: "Вот и пройден один из самых важных этапов - вы вступили на тропу взрослой жизни, мисс МакФи! Желаю вам широких возможностей и успехов в любом начинании. Сразу или после длительных экспериментов, но найти свой путь, по которому идти вам будет по-настоящему в радость, и который приведет вас к осуществлению всех ваших мечтаний. Поздравляю!", author: "Хаттори Райто"},
    {text: "Дорогая Эвилин! Сегодня ты выпускница славного факультета Пуффендуй! Поздравляю тебя с этим замечательным днём! Ты — настоящее воплощение лучших качеств пуффендуйцев: душевная, заботливая и невероятно внимательная. Твоя способность подобрать нужные слова, чтобы сгладить любой конфликт и подбодрить, когда это особенно важно, — настоящий дар.Ты умеешь сохранять спокойствие даже в самых запутанных ситуациях, будто у тебя всегда есть идеальный план (или хотя бы крутой шифр, который всё объясняет). Твоя любовь к тайнам, загадкам и детективам делает каждый день приключением, а твоё умение писать смешные тексты заставляет всех вокруг улыбаться. Пусть впереди тебя ждёт столько же увлекательных головоломок, сколько ты любишь, и столько же добрых моментов, сколько ты даришь другим. Пусть рядом всегда будут верные друзья и любимые животные, а все тайны раскрываются легко и вовремя. Горжусь тобой и желаю, чтобы твоя жизнь была такой же яркой, тёплой и удивительной, как ты сама! С выпуском, Эвилин!", author: "Энни"},
    {text: "Моя дорогая Эвелин, поздравляю тебя и в то же время очень сильно грущу! Ты стала одной из первых людей, с кем я подружилась в Хогвартсе, и ты очень быстро стала мне близкой. Наши шутки, ночи и смех - это то, что я бережно храню в сердце и очень хочу и дальше пополнять эту коллекцию. Хочу верить, что ты останешься яркой звёздочкой, пламенем, не только в школе, но и в жизни факультета и моей лично. Я ценю каждое слово, каждый день, проведённый вместе, все твои слова поддержки, и безумно скучаю по временам, когда на разговоры перед сном ещё хватало времени. Пусть впереди тебя ждёт много приятных открытий, целей, побед и волшебства. Люблю тебя всей душой и горжусь таким великолепным профессором! ", author: "Грэйс"},
    // Добавьте еще 7 таких строк!
];

// --- Объекты игры ---
let girl = { x: 0, y: 0, size: 40 };
let balls = [];
let currentBallIndex = 0;
let isPausedForPopup = false;

// --- Управление ---
let keys = {};
let targetTouchX = null;
let targetTouchY = null;

// --- Настройки ---
const BALL_COUNT = 10;
const FIELD_PADDING = 50; // Чтобы мячи не улетали за интерфейс

/* ⚠️ ВАЖНО! Вставьте сюда СВОИ прямые ссылки на raw.githubusercontent.com */
const imgGirl = new Image();
imgGirl.src = 'https://raw.githubusercontent.com/GGreyland/for_evylin/main/character.png';

const imgBall = new Image();
imgBall.src = 'https://raw.githubusercontent.com/GGreyland/for_evylin/main/ball.png';

const imgBg = new Image();
imgBg.src = 'https://raw.githubusercontent.com/GGreyland/for_evylin/main/field.png';

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    if (!isPausedForPopup || currentBallIndex === 0) {
         girl.x = canvas.width / 2;
         girl.y = canvas.height / 2;
    }
}

class Ball {
    constructor(index) {
        this.index = index;
        this.reset();
    }
    
    reset() {
        const edges = ['top', 'right', 'bottom', 'left'];
        const edge = edges[Math.floor(Math.random() * edges.length)];
        
        switch(edge) {
            case 'top':
                this.x = Math.random() * (canvas.width - FIELD_PADDING * 2) + FIELD_PADDING;
                this.y = -30;
                break;
            case 'right':
                this.x = canvas.width + 30;
                this.y = Math.random() * (canvas.height - FIELD_PADDING * 2) + FIELD_PADDING;
                break;
            case 'bottom':
                this.x = Math.random() * (canvas.width - FIELD_PADDING * 2) + FIELD_PADDING;
                this.y = canvas.height + 30;
                break;
            case 'left':
                this.x = -30;
                this.y = Math.random() * (canvas.height - FIELD_PADDING * 2) + FIELD_PADDING;
                break;
        }
        
        this.size = 25;
        this.caught = false;
        
        const angleToCenter = Math.atan2(canvas.height / 2 - this.y, canvas.width / 2 - this.x);
        const randomAngle = angleToCenter + (Math.random() - 0.5) * 1.5; // +/- ~43 градуса
        
        this.speed = 2 + Math.random() * 1.5; // Средняя скорость от 2 до 3.5
        this.vx = Math.cos(randomAngle) * this.speed;
        this.vy = Math.sin(randomAngle) * Math.sign(angleToCenter) * this.speed;
    }
    
    update() {
        if (this.caught) return;
        
        this.x += this.vx;
        this.y += this.vy;
        
        // Отскок от стенок игрового поля
        if (this.x <= FIELD_PADDING || this.x >= canvas.width - FIELD_PADDING) {
            this.vx *= -1;
            this.x = Math.max(FIELD_PADDING, Math.min(this.x, canvas.width - FIELD_PADDING));
        }
        if (this.y <= FIELD_PADDING || this.y >= canvas.height - FIELD_PADDING) {
            this.vy *= -1;
            this.y = Math.max(FIELD_PADDING, Math.min(this.y, canvas.height - FIELD_PADDING));
        }
        
        // Проверка на сбор девочкой ТОЛЬКО ДЛЯ ТОГО МЯЧА, ЧТО ЛЕТИТ
        if (currentBallIndex !== this.index) return;

        const dx = girl.x - this.x;
        const dy = girl.y - this.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        if (distance < girl.size / 2 + this.size / 2) {
            this.caught = true;
            showCongratulations(this.index);
        }
    }
    
    draw() {
        // Подсветка золотым контуром остается поверх картинки
        if (this.caught) {
            ctx.beginPath();
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'gold';
            ctx.ellipse(this.x, this.y, this.size + 6, this.size + 6, 0, 0, Math.PI * 2);
            ctx.stroke();
        }
        
        // Рисуем саму картинку мяча
        ctx.drawImage(imgBall, this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
    }
}

function initGame() {
    resizeCanvas();
    balls = [];
    for(let i = 0; i < BALL_COUNT; i++) {
        balls.push(new Ball(i));
    }
    currentBallIndex = 0;
    isPausedForPopup = false;
}

function showCongratulations(index) {
    isPausedForPopup = true;
    
    const data = congratulations[index];
    messageText.textContent = data.text;
    authorText.textContent = `— ${data.author}`;
    
    // Имя автора может быть длинным, корректируем ширину попапа
    const estimatedWidth = Math.min(400, Math.max(250, data.author.length * 10));
    popup.style.maxWidth = `${estimatedWidth}px`;
    
    popup.classList.add('active');
}

function hideCongratulations() {
    popup.classList.remove('active');
    setTimeout(() => {
        isPausedForPopup = false;
        currentBallIndex++;
        if (currentBallIndex < BALL_COUNT) {
             // Сбрасываем управление, чтобы игрок не улетел далеко во время паузы
            keys = {};
            targetTouchX = null;
            targetTouchY = null;
        } else {
            finishGame();
        }
    }, 400); // Ждем завершения анимации CSS
}

function finishGame() {
    alert("Ты собрала все поздравления! Поздравляем!");
    initGame(); // Перезапуск цикла
}

// --- Игровой цикл ---
function gameLoop() {
    if (isPausedForPopup) {
        requestAnimationFrame(gameLoop);
        return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Фон
    if (imgBg.complete) {
        ctx.drawImage(imgBg, 0, 0, canvas.width, canvas.height);
    } else {
        ctx.fillStyle = '#2d5a27'; /* Трава */
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Разметка полей для квиддича (ворота)
    ctx.strokeStyle = '#ffffff40';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.rect(FIELD_PADDING, FIELD_PADDING, canvas.width - FIELD_PADDING * 2, canvas.height - FIELD_PADDING * 2);
    ctx.moveTo(canvas.width / 2, FIELD_PADDING);
    ctx.lineTo(canvas.width / 2, canvas.height - FIELD_PADDING);
    ctx.stroke();

    ctx.fillStyle = '#f1c40f';
    ctx.beginPath();
    ctx.ellipse(canvas.width / 2, FIELD_PADDING + 50, 40, 15, 0, 0, Math.PI * 2);
    ctx.fill();
    [canvas.height / 3, canvas.height / 3 * 2].forEach(yPos => {
        ctx.beginPath();
        ctx.ellipse(FIELD_PADDING + 50, yPos, 15, 40, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(canvas.width - FIELD_PADDING - 50, yPos, 15, 40, 0, 0, Math.PI * 2);
        ctx.fill();
    });

    handleInput();

    // Девочка 👧
    if (imgGirl.complete) {
        ctx.drawImage(imgGirl, girl.x - girl.size / 2, girl.y - girl.size / 2, girl.size, girl.size);
    } else {
        ctx.fillStyle = '#ff6600';
        ctx.beginPath();
        ctx.arc(girl.x, girl.y, girl.size / 2, 0, Math.PI * 2);
        ctx.fill();
    }

    // Мячи ⚽
    balls.forEach(ball => {
        ball.update();
        ball.draw();
    });

    requestAnimationFrame(gameLoop);
}

// --- Управление ---
function handleInput() {
    let moveSpeed = 5;
    
    // Смартфон: тянем пальцем
    if (targetTouchX !== null && targetTouchY !== null) {
        const angle = Math.atan2(targetTouchY - girl.y, targetTouchX - girl.x);
        girl.x += Math.cos(angle) * moveSpeed;
        girl.y += Math.sin(angle) * moveSpeed;
    } 
    // ПК: стрелки
    else {
        if (keys['ArrowUp']) girl.y -= moveSpeed;
        if (keys['ArrowDown']) girl.y += moveSpeed;
        if (keys['ArrowLeft']) girl.x -= moveSpeed;
        if (keys['ArrowRight']) girl.x += moveSpeed;
    }

    // Ограничиваем передвижение рамками поля
    girl.x = Math.max(girl.size / 2 + FIELD_PADDING, Math.min(girl.x, canvas.width - girl.size / 2 - FIELD_PADDING));
    girl.y = Math.max(girl.size / 2 + FIELD_PADDING, Math.min(girl.y, canvas.height - girl.size / 2 - FIELD_PADDING));
}

window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// Тач-управление
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    targetTouchX = touch.clientX - rect.left;
    targetTouchY = touch.clientY - rect.top;
});
canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    targetTouchX = touch.clientX - rect.left;
    targetTouchY = touch.clientY - rect.top;
});
canvas.addEventListener('touchend', () => {
    targetTouchX = null;
    targetTouchY = null;
});

// Клик мышью тоже работает как точка назначения
canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    targetTouchX = e.clientX - rect.left;
    targetTouchY = e.clientY - rect.top;
});
canvas.addEventListener('mousemove', (e) => {
    if (targetTouchX !== null) {
        const rect = canvas.getBoundingClientRect();
        targetTouchX = e.clientX - rect.left;
        targetTouchY = e.clientY - rect.top;
    }
});
canvas.addEventListener('mouseup', () => {
    targetTouchX = null;
    targetTouchY = null;
});

// Закрытие плашки
nextBtn.addEventListener('click', hideCongratulations);
popup.addEventListener('click', (e) => {
    // Если кликнули мимо кнопки — закрываем тоже
    if (e.target === popup) hideCongratulations();
});

window.addEventListener('resize', resizeCanvas);

initGame();
gameLoop();
</script>
