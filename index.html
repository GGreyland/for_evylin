<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Выпускной Эвелин МакФи</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #2d5a27; /* Трава */
            font-family: Arial, sans-serif;
            touch-action: none; /* Отключаем стандартные скроллы при свайпе на смартфоне */
        }
        
        .header {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 16px; opacity: 0.9; }

        #gameCanvas {
            display: block;
            background-image: linear-gradient(#8ecae6 0%, #219ebc 100%); /* Небо квиддича */
        }

        /* Плашка поздравления */
        #congratPopup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            color: #333;
            max-width: 90%;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        #congratPopup.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }
        #congratPopup p.message { 
            font-size: 18px; 
            margin-bottom: 15px; 
            line-height: 1.4;
        }
        #nextBtn {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 16px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #nextBtn:hover { background-color: #2ecc71; }

        /* Добавил стиль для кнопки "Повторить игру" */
        #restartBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 25px;
            font-size: 16px;
            background-color: #ff6b6b; /* Красный цвет */
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: none; /* Скрываем её изначально */
        }
        #restartBtn:hover { background-color: #f44336; }
    </style>
</head>
<body>
<div class="header">
    <h1>Выпускной Эвелин МакФи</h1>
    <p>Собери все 10 мячей!</p>
</div>

<button id="restartBtn">Новая игра</button>

<div id="congratPopup">
    <p class="message">Здесь будет текст поздравления</p>
    <p class="author">— Грэйс</p>
    <button id="nextBtn">Дальше</button>
</div>
